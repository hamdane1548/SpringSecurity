<!DOCTYPE HTML>
<html lang="en">
<head>
    <script>
        const http = new XMLHttpRequest();
        const url='http://127.0.0.1:8089/product/test3';
        http.open("POST", url);
        http.send();
        http.onreadystatechange = (e) => {
            document
                .getElementById("output")
                .innerHTML = http.responseText;
        }
    </script>
</head>
<body>
<div id="output"></div>
</body>
</html>
